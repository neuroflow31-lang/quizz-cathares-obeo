/* OBEO — Quiz Le monde animal (moteur dérivé du quiz France). Scène 1920×1080 mise à l'échelle (voir app.js). */
:root {
  --bg: #F5F1E9;
  --green: #247F78;
  --green-dark: #1B625C;
  --green-soft: #DCEFE8;
  --orange: #DA8548;
  --orange-dark: #B85A1B;
  --text: #292927;
  --muted: #5F5C56;
  --card: #FFFFFF;
  --red: #B23A30;
  --red-soft: #F7E1DE;
  --line: #E4DDCF;
  --shadow: 0 8px 30px rgba(41, 41, 39, .10);
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; }
#viewport { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* ---------- animations (250–500 ms, douces) ---------- */
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
@keyframes zoomIn { from { opacity: 0; transform: scale(.98) } to { opacity: 1; transform: none } }
.screen { position: absolute; inset: 0; animation: fadeIn .3s ease both; }
.a-up { animation: slideUp .45s ease both; }
.a-zoom { animation: zoomIn .4s ease both; }
.d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .01s !important; } }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 18px; border: 0; cursor: pointer; border-radius: 999px;
  font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--green); padding: 0 56px; height: 96px; font-size: 38px;
  box-shadow: 0 8px 20px rgba(36, 127, 120, .28); transition: transform .25s ease, background .25s ease, box-shadow .25s ease; text-transform: uppercase; }
.btn:hover { background: var(--green-dark); transform: translateY(-2px); }
.btn:focus-visible, .chip-btn:focus-visible, .icon-btn:focus-visible, .answer:focus-visible, input:focus-visible { outline: 5px solid #1B3A38; outline-offset: 4px; }
.btn.orange { background: var(--orange-dark); box-shadow: 0 8px 20px rgba(184, 90, 27, .3); }
.btn.orange:hover { background: #9C4A12; }
.btn.outline { background: #fff; color: var(--orange-dark); border: 4px solid var(--orange-dark); box-shadow: none; }
.btn.outline:hover { background: #FFF4EA; }
.btn.small { height: 76px; font-size: 30px; padding: 0 40px; }
.btn[aria-disabled="true"] { background: #8C8982; box-shadow: none; cursor: not-allowed; transform: none; }
.btn svg { width: 40px; height: 40px; flex: none; }
.icon-btn { display: inline-flex; align-items: center; gap: 12px; height: 68px; padding: 0 28px; border-radius: 999px; border: 3px solid var(--line);
  background: #fff; color: var(--text); font-size: 26px; font-weight: 600; cursor: pointer; transition: background .25s, border-color .25s; }
.icon-btn:hover { background: #FBF8F2; border-color: var(--green); }
.icon-btn svg { width: 32px; height: 32px; }

/* ---------- éléments communs ---------- */

:root { --serif: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
.title-serif, .qtext, .award h2, .savez h2, .verdict, .rsub, .confirm h2, .fullrank h2, .thanks p, .pod .blk { font-family: var(--sans); letter-spacing: -.005em; }
.qtext { font-weight: 750; }

/* image + décor de secours */

.lookphoto.fallback .num { font-size: 300px; }

/* intro de chapitre / accueil */
.home h1 .q { font-size: 62px; letter-spacing: .12em; color: var(--orange-dark); }
.home h1 .t { font-size: 84px; white-space: normal; line-height: 1.02; margin-top: 6px; text-transform: uppercase; }
.home.france-home h1 .q { font-size: 118px; letter-spacing: .02em; color: var(--green-dark); }
.home.france-home h1 .t { font-size: 52px; text-transform: none; line-height: 1.1; margin-top: 10px; font-weight: 700; color: var(--green-dark); }
.home .col { width: 840px; }
.home .sub { font-size: 42px; }
.chnum { display: inline-block; background: var(--orange-dark); color: #fff; font-weight: 800; font-size: 34px; letter-spacing: .1em; padding: 10px 34px; border-radius: 999px; margin-bottom: 12px; }
.testlink { position: absolute; left: 18px; bottom: 14px; width: 46px; height: 46px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); opacity: .28; cursor: pointer; display: grid; place-items: center; transition: opacity .25s; z-index: 5; }
.testlink:hover, .testlink:focus-visible { opacity: 1; background: #fff; }
.testlink svg { width: 26px; height: 26px; }

/* types de questions */
.kicker { align-self: flex-start; display: inline-block; background: var(--green-soft); color: var(--green-dark); font-weight: 800; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 26px; border-radius: 999px; }
.rev .kicker { font-size: 22px; padding: 5px 20px; }
.clues { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.clues li { font-size: 32px; line-height: 1.3; padding-left: 38px; position: relative; color: var(--text); }
.clues li::before { content: ""; position: absolute; left: 6px; top: .5em; width: 16px; height: 16px; border-radius: 50%; background: var(--orange); }

/* écran « réfléchir » (énigme / réflexion sans image) */
.think { position: absolute; left: 140px; right: 140px; top: 150px; bottom: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 36px; text-align: center; }
.think .qtext { font-size: 66px; line-height: 1.18; max-width: 1560px; }
.think .clues { align-items: flex-start; background: #fff; border-radius: 36px; box-shadow: var(--shadow); padding: 30px 48px; }
.think .clues li { font-size: 38px; text-align: left; }
.think .hint { font-size: 32px; color: var(--muted); margin: 0; }
.lookside .kicker { font-size: 28px; }

/* révélation : cartes explication / anecdote, boutons de fin */
.savez.anec { border-left-color: var(--green); background: #FBFAF6; }
.savez.anec h2 { text-transform: uppercase; letter-spacing: .04em; font-size: 32px; }
.savez.anec p { font-size: 28px; }
.rev .right .photo { height: 190px; }
.rev.awd .right { display: none; }
.rev.awd .left { flex: 1; }
.nextbar { position: absolute; right: 60px; bottom: 40px; display: flex; gap: 22px; align-items: center; animation: slideUp .45s ease .2s both; }
.nextbar .btn { height: 92px; font-size: 36px; }
.award .row1 .btns { display: flex; gap: 18px; align-items: center; }
.rev.many .nextbar .btn { height: 84px; }

/* podium progressif */
.pod.hide .nm, .pod.hide .sc, .pod.hide .trophy, .pod.hide span { visibility: hidden; }
.pod.hide .blk { background: #E4DDCF; color: #B8B2A5; box-shadow: none; }
.pod.noanim { animation: none; }
.final .podium { top: 310px; }
.final .podstep { position: absolute; left: 80px; width: 1000px; top: 790px; display: flex; justify-content: center; }
.final.revealing .podstep .btn { height: 104px; font-size: 40px; }
.final.revealing .fullrank, .final.revealing .thanks, .final.revealing .again { display: none; }
.final.revealing .podium { left: 460px; width: 1000px; top: 330px; }

/* mode test animateur */
#testbar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; gap: 4px; padding: 3px 6px; background: rgba(27,58,56,.92); border-radius: 0 0 14px 14px; font-family: var(--sans); }
#testbar[hidden] { display: none; }
#testbar button { border: 0; background: transparent; color: #fff; font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 8px; cursor: pointer; font-family: var(--sans); }
#testbar button:hover { background: rgba(255,255,255,.22); }
#testbar .tb-label { color: #F6DEC4; font-size: 13px; font-weight: 800; padding: 3px 8px; letter-spacing: .08em; }
#testbar.min button:not(.tb-toggle), #testbar.min .tb-label { display: none; }
.testtag { position: absolute; left: 60px; bottom: 6px; font-size: 18px; color: #8C8982; z-index: 4; }
.testmenu { position: absolute; inset: 0; padding: 44px 80px 30px; display: flex; flex-direction: column; gap: 8px; }
.testmenu h1 { font-size: 48px; margin: 0; }
.testmenu .note { font-size: 24px; color: var(--muted); margin: 0 0 6px; }
.testmenu h3 { margin: 6px 0 2px; font-size: 26px; letter-spacing: .06em; text-transform: uppercase; color: var(--orange-dark); }
.tmchap { display: flex; gap: 14px; align-items: center; }
.tmchap .lab { flex: none; width: 480px; font-size: 26px; font-weight: 700; }
.tmbtn { border: 3px solid var(--line); background: #fff; color: var(--text); border-radius: 16px; font-size: 23px; font-weight: 700; padding: 4px 12px; min-height: 52px; cursor: pointer; font-family: var(--sans); }
.tmbtn:hover { border-color: var(--green); background: #F2F8F6; }
.tmbtn small { display: block; font-size: 15px; font-weight: 600; color: var(--muted); line-height: 1.1; }
.tmbtn.bonus { border-color: var(--orange-dark); }
.tmq { width: 118px; min-height: 52px; padding: 3px 6px; }
.tmrow { display: flex; gap: 14px; flex-wrap: wrap; }
.tmrow .btn { height: 66px; font-size: 26px; padding: 0 34px; text-transform: none; }

.final .bg { opacity: 1; }
.final.revealing .podstep { left: 460px; }
.final.group .thanks { top: 470px; }

.home.france-home .sub { font-size: 38px; }
.home h1 { margin-top: 36px; }
.photo.fallback .mark { width: 40%; max-width: 330px; opacity: .22; }
.photo.fallback img.mark { width: 40%; height: auto; max-width: 330px; object-fit: contain; animation: none; }

/* Écrans d'introduction de chapitre : accroches longues (3 phrases) — tout doit tenir à l'écran, bouton compris */
.intro .col { top: 50px; }
.intro .logo { height: 130px; }
.intro h1 { margin-top: 26px; }
.intro h1 .t { font-size: 76px; }
.intro .rule { margin: 26px 0; }
.intro .sub { font-size: 34px; line-height: 1.32; }
.intro .place { font-size: 28px; margin-top: 14px; }
.intro .bonus { font-size: 28px; padding: 9px 28px; }
.intro .btn { margin-top: 28px; height: 100px; }
.intro .col { width: 770px; }

/* =================================================================
   QUIZ « LE MONDE ANIMAL » — trois zones après validation
   ================================================================= */
.zone { background: #fff; border-radius: 30px; box-shadow: var(--shadow); padding: 20px 30px; border-left: 12px solid var(--line); animation: slideUp .45s ease both; }
.zone h2 { margin: 0 0 8px; font-size: 34px; font-weight: 800; color: var(--green-dark); }
.zone p { margin: 0; font-size: 30px; line-height: 1.36; color: var(--text); }
.zone.long p { font-size: 27px; }
.zrep { display: flex; gap: 22px; align-items: center; border-left-color: var(--green); background: var(--green-soft); animation-delay: .05s; }
.zrep p { font-size: 34px; font-weight: 700; }
.zrep .thumb { width: 150px; height: 112px; object-fit: cover; border-radius: 18px; flex: none; }
.zwhy { border-left-color: var(--orange); animation-delay: .2s; }
.zsav { border-left-color: var(--green); background: #FBFAF6; animation-delay: .35s; }
.zsav h2 { color: var(--orange-dark); }
.rev .right { gap: 18px; }
/* accueil : titre sur 2 lignes + sous-titre long — tout doit tenir à l'écran */
.home.france-home .col { top: 50px; width: 800px; }
.home.france-home .logo { height: 150px; }
.home.france-home h1 { margin-top: 26px; }
.home.france-home h1 .q { font-size: 104px; line-height: 1; }
.home.france-home h1 .t { font-size: 44px; margin-top: 16px; }
.home.france-home .rule { margin: 26px 0; }
.home.france-home .sub { font-size: 34px; }
.home.france-home .btn { margin-top: 30px; }
/* podium : « Nom — X / 42 » */
.pod .nm { font-size: 34px; white-space: normal; line-height: 1.15; margin-bottom: 14px; }
/* révélation : les trois zones doivent tenir au-dessus du bouton, même avec des textes longs */
.zone { padding: 16px 26px; border-radius: 26px; }
.zone h2 { font-size: 30px; margin-bottom: 6px; }
.zone p { font-size: 27px; line-height: 1.32; }
.zone.long p { font-size: 24px; }
.zrep p { font-size: 30px; }
.zrep.long p { font-size: 25px; font-weight: 700; }
.zrep .thumb { width: 130px; height: 98px; }
.rev .right { gap: 14px; }
/* énigmes à indices : question + indices + 3 choix à l'écran */
.qmain .clues { gap: 6px; }
.qmain .clues li { font-size: 28px; }

/* =================================================================
   QUIZ « EXPRESSIONS FRANÇAISES » — blocs après validation
   ✅ Réponse · 💬 Ce que ça veut dire · 🕰️ D’où ça vient · ✨ Le saviez-vous ? · 🗣️ Et vous ?
   ================================================================= */
.zsens { border-left-color: var(--orange); }
.zorigine { border-left-color: var(--green); background: #FBFAF6; }
.zsavez { border-left-color: var(--orange); background: #FDF6EE; }
.zsavez h2 { color: var(--orange-dark); }
.zetvous { border-left-color: var(--green-dark); background: var(--green-soft); }
.zetvous p { font-style: italic; }
.rev .right.dense { gap: 10px; }
.rev .right.dense .zone { padding: 12px 24px; }
.rev .right.dense .zone h2 { font-size: 27px; margin-bottom: 4px; }
.rev .right.dense .zone p { font-size: 25px; line-height: 1.28; }
.rev .right.dense .zrep p { font-size: 27px; }
/* l'expression étudiée, en tête de question */
.kicker { font-style: italic; text-transform: none; letter-spacing: 0; }
/* titre final long */
.rank.finale h1 { font-size: 60px; line-height: 1.1; }
.final h1.fintitle { font-size: 64px; line-height: 1.1; }

</style>
</head>

/* Logique pure (scores, classement) — testée par tests/logic.test.mjs */
(function (root) {
  var MAX_PLAYERS = 24;

  function cleanName(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 24); }

  function addPlayer(players, name, id) {
    var n = cleanName(name);
    if (!n || players.length >= MAX_PLAYERS) return players;
    return players.concat([{ id: id, name: n, score: 0, last: 0 }]);
  }
  function renamePlayer(players, id, name) {
    return players.map(function (p) { return p.id === id ? Object.assign({}, p, { name: cleanName(name) || p.name }) : p; });
  }
  function removePlayer(players, id) { return players.filter(function (p) { return p.id !== id; }); }
  function adjust(players, id, delta) {
    return players.map(function (p) { return p.id === id ? Object.assign({}, p, { score: Math.max(0, p.score + delta) }) : p; });
  }
  function resetScores(players) { return players.map(function (p) { return Object.assign({}, p, { score: 0 }); }); }

  /* Classement : tri par score décroissant (ordre d'inscription conservé en cas d'égalité),
     rang « compétition » : 1, 2, 2, 4 — une égalité reste une égalité. */
  function ranking(players) {
    var sorted = players.map(function (p, i) { return { p: p, i: i }; })
      .sort(function (a, b) { return b.p.score - a.p.score || a.i - b.i; })
      .map(function (x) { return x.p; });
    var out = [];
    sorted.forEach(function (p, i) {
      var rank = (i > 0 && p.score === sorted[i - 1].score) ? out[i - 1].rank : i + 1;
      out.push({ player: p, rank: rank });
    });
    return out;
  }
  function rankLabel(r) { return r === 1 ? '1er' : r + 'e'; }

  var api = { MAX_PLAYERS: MAX_PLAYERS, cleanName: cleanName, addPlayer: addPlayer, renamePlayer: renamePlayer,
    removePlayer: removePlayer, adjust: adjust, resetScores: resetScores, ranking: ranking, rankLabel: rankLabel };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.QuizLogic = api;
})(typeof window !== 'undefined' ? window : globalThis);

  function startChapter() { state.phase = firstPhase(Q[state.idx]); state.selected = null; state.awarded = {}; go('question'); }

  function askQuit() {

  }
  function openRanking() { prevScreen = state.screen === 'ranking' ? prevScreen : state.screen; state.rankMode = 'peek'; go('ranking'); }

  /* ---------- question ---------- */
  function question() {
    if (M.errors.length) { stage.innerHTML = ''; showErrors(); return; }
    var q = Q[state.idx], phase = state.phase;
    var revealed = phase === 'revealed' || phase === 'award';
    var indiv = indivMode();
    var two = q.kind === 'two';
    var cls = 'screen' + (two ? ' tf' : '') + (q.type === 'visual' ? ' vis' : '') +

          h('span', { class: 'lt', text: lt }), h('span', { class: 'tx', text: a }), tag, (!revealed ? h('span', { class: 'dot' }) : null));

    // la sélection (clic ou survol) ne révèle jamais la bonne réponse : mise à jour sur place, validation obligatoire

      s.appendChild(h('div', { class: 'qmain' + (two ? ' wide' : '') },
        kicker(q), bonusTag(q),
        h('h1', { class: 'qtext a-up', text: q.q }),

    } else {
      var left = h('div', { class: 'left' }, kicker(q), bonusTag(q), h('h1', { class: 'qtext', text: q.q }), answers);
      var right = h('div', { class: 'right' });
      // Zones après validation : ✅ Réponse · 💬 Ce que ça veut dire · 🕰️ D’où ça vient · ✨ Le saviez-vous ? · 🗣️ Et vous ?
      var goodTxt = two ? q.answers[q.correct] : LETTERS[q.correct] + ' — ' + q.answers[q.correct];
      var thumb = (q.type === 'visual' || q.explicitImage) ? h('img', { class: 'thumb', src: window.__img(q.image), alt: '', onerror: function () { this.remove(); } }) : null;
      right.appendChild(h('div', { class: 'zone zrep' + ((q.short || goodTxt).length > 70 ? ' long' : '') }, thumb, h('div', null, h('h2', { text: '✅ Réponse' }), h('p', { text: q.short || goodTxt }))));
      var dense = q.blocks.reduce(function (a, b) { return a + b.text.length; }, 0) > 330 || q.blocks.length >= 4;
      if (dense) right.classList.add('dense');

        right.appendChild(h('div', { class: 'zone z' + b.key + (b.text.length > 170 ? ' long' : ''), style: 'animation-delay:' + (0.15 + k * 0.12) + 's' }, h('h2', { text: b.title }), h('p', { text: b.text })));
      });
      s.appendChild(h('div', { class: 'qmain' }, left, right));
      var lastQ = state.idx === N - 1;
      var nextLabel = lastQ ? (indiv ? 'Voir le classement final' : 'Terminer le quiz') : (pos(state.idx).last ? 'Manche suivante' : 'Question suivante');
      var nextBtn = h('button', { class: 'btn orange', onclick: next }, nextLabel, icon('arrow'));
      if (indiv && phase === 'revealed') {
        s.appendChild(h('div', { class: 'nextbar' }, h('button', { class: 'btn orange', onclick: function () { state.phase = 'award'; save(); question(); } }, 'Attribuer les points', icon('arrow'))));
      } else if (indiv) s.appendChild(awardPanel(nextBtn, q));

  function addTestTag(s, q) {

  }

  function miniRanking() {

  function reveal() { state.phase = 'revealed'; state.awarded = {}; save(); question(); }

  function awardPanel(nextBtn, q) {

      var minus = h('button', { class: 'minus', 'aria-label': 'Corriger : retirer ' + step + ' point' + (step > 1 ? 's' : '') + ' à ' + p.name, text: '−' + step });
      var chip = h('div', { class: 'pchip' }, nm, minus, plus);

  function next() {

      else go('intro');
    } else go('question');
  }

  /* ---------- classement ---------- */
  function ranking() {
    var mode = state.rankMode || 'peek';
    var rows = L.ranking(state.players);
    var n = rows.length;
    var twoCols = n > 8;
    var rowsPerCol = twoCols ? Math.ceil(n / 2) : Math.max(n, 1);
    var avail = 560;
    var rh = Math.max(46, Math.min(84, Math.floor((avail - (rowsPerCol - 1) * 12) / rowsPerCol)));
    var rf = rh >= 70 ? 34 : rh >= 56 ? 30 : 26;
    var max = Math.max.apply(null, rows.map(function (r) { return r.player.score; }).concat([1]));
    var list = h('div', { class: 'rlist', style: '--rows:' + rowsPerCol + ';--rh:' + rh + 'px;--rf:' + rf + 'px;grid-template-columns:' + (twoCols ? '1fr 1fr' : '1fr') });
    var bars = [], step = mode === 'finale' ? Math.min(0.45, 6 / Math.max(n, 1)) : 0.05;

    var s = h('div', { class: 'screen rank' + (withPhoto ? ' withphoto' : '') + rankCls },
      withPhoto ? imageBox(cfgImage('rankingImage'), { cls: 'a-zoom', alt: 'Illustration' }) : null,
      h('div', { class: 'head' }, logo()),
      h('div', { class: 'wrap' },
        h('h1', { class: 'title-serif a-up', text: title }),
        subtitle ? h('div', { class: 'rsub', text: subtitle }) : null,
        n ? list : h('p', { class: 'hint', style: 'font-size:34px', text: 'Aucun participant.' }),
        h('div', null, btn)));
    show(s);
    requestAnimationFrame(function () { requestAnimationFrame(function () { bars.forEach(function (b) { b[0].style.transitionDelay = b[2] + 's'; b[0].style.width = Math.max(b[1] * 100, 0) + '%'; }); }); });
  }
  function startPodium() { state.podiumStep = 0; state.justRevealed = -1; go('final'); }

  /* ---------- final : podium révélé 3e → 2e → 1er ---------- */
  function podiumTop() {
    var rows = L.ranking(state.players);
    var scored = rows.filter(function (r) { return r.player.score > 0; });
    return (scored.length ? scored : rows).slice(0, 3);
  }
  function finalScreen() {
    var group = state.mode === 'group' || !state.players.length;
    var rows = L.ranking(state.players);

    var total = top.length, step = Math.min(state.podiumStep || 0, total);

    var s = h('div', { class: 'screen final' + (group ? ' group' : '') + (done ? '' : ' revealing') },
      h('div', { class: 'bg', style: 'background: linear-gradient(160deg, #DCEFE8, #F5F1E9 55%, #F6DEC4)' }),
      h('div', { class: 'head' }, logo()),
      h('h1', { class: 'title-serif a-up' + (group ? ' fintitle' : ''), text: group ? CFG.finaleTitle : 'BRAVO À TOUS !' }),
      h('div', { class: 'subt a-up d1', text: CFG.title + ' — ' + CFG.subtitle }));

  }
  function revealNextPodium() {

  function replay() {
    state.players = L.resetScores(state.players);
    state.idx = 0; state.phase = firstPhase(Q[0]); state.selected = null; state.awarded = {}; state.rankMode = 'peek'; state.podiumStep = 0; state.justRevealed = -1;
    lastProgress = 0;
    if (state.test) { go('testmenu'); return; }
    go('players');
  }

  /* ---------- confettis légers (écran final uniquement) ---------- */
  var cv = document.getElementById('confetti'), raf = null, parts = [], t0 = 0;
  function startConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    stopConfetti();
    var dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    var cols = ['#247F78', '#DA8548', '#E9DCC3', '#7FB8B1', '#F0C79E'];
    parts = [];
    for (var i = 0; i < 70; i++) parts.push({ x: Math.random() * innerWidth, y: -Math.random() * innerHeight, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6,
      c: cols[i % cols.length], vy: 40 + Math.random() * 50, vx: -12 + Math.random() * 24, ph: Math.random() * 6, a: .75 });
    t0 = performance.now(); var last = t0;
    (function tick(now) {
      var dt = Math.min((now - last) / 1000, .05); last = now;
      var el = (now - t0) / 1000;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(function (p) {
        p.y += p.vy * dt; p.x += (p.vx + Math.sin(el + p.ph) * 14) * dt;
        if (p.y > innerHeight + 20 && el < 9) { p.y = -20; p.x = Math.random() * innerWidth; }
        ctx.globalAlpha = p.a * (el > 9 ? Math.max(0, 1 - (el - 9)) : 1);
        ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.w, p.h);
      });
      if (el < 10) raf = requestAnimationFrame(tick); else stopConfetti();
    })(t0);
  }
  function stopConfetti() {
    if (raf) cancelAnimationFrame(raf); raf = null;
    var c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
  }

  /* =====================================================================
     MODE TEST ANIMATEUR (accès discret : roue crantée en bas à gauche de l'accueil, ou touche T sur l'accueil)
     Non sauvegardé : un rechargement de page ramène à la partie réelle.
     ===================================================================== */
  var DEMO = ['Marie', 'Jean', 'Monique', 'Pierre'];
  function enterTest() {
    state.test = true; state.mode = 'individual';
    if (!state.players.length) { DEMO.forEach(function (n) { state.players = L.addPlayer(state.players, n, state.nextId++); }); }
    state.idx = 0; state.phase = firstPhase(Q[0]); state.selected = null; state.awarded = {}; state.rankMode = 'peek'; state.podiumStep = 0; state.justRevealed = -1;
    go('testmenu');
  }
  function clearTest() { testbar.hidden = true; }
  function exitTest() { reset(); clearTest(); go('home'); }
  function toIntro(chIdx) { state.idx = CH[chIdx].start; state.phase = firstPhase(Q[state.idx]); state.selected = null; state.awarded = {}; lastProgress = 0; go('intro'); }
  function toQuestion(i, phase) {
    i = Math.max(0, Math.min(N - 1, i));
    state.idx = i; state.phase = phase || firstPhase(Q[i]); state.selected = null; state.awarded = {}; state.mode = 'individual';
    if (!state.players.length) DEMO.forEach(function (n) { state.players = L.addPlayer(state.players, n, state.nextId++); });
    go('question');
  }
  function randomScores() {
    state.players = state.players.map(function (p) { return Object.assign({}, p, { score: Math.floor(Math.random() * 28) }); });
  }
  function testRanking(mode, ch) { prevScreen = 'testmenu'; state.rankMode = mode; state.rankChapter = ch || CFG.rankingAfterChapters[0]; go('ranking'); }
  function testPodium() {
    if (!state.players.some(function (p) { return p.score > 0; })) randomScores();
    state.mode = 'individual'; state.podiumStep = 0; state.justRevealed = -1; go('final');
  }
  function testStep(d) {
    if (state.screen === 'intro') { if (d > 0) startChapter(); else toIntro(Math.max(0, chapterOf(state.idx).idx - 1)); return; }
    if (state.screen === 'question') { toQuestion(state.idx + d); return; }
    toQuestion(state.idx + (d > 0 ? 0 : 0));
  }
  function drawTestbar() {
    if (!state.test) { testbar.hidden = true; return; }
    buildBar(state.screen === 'testmenu');
  }
  var barMin = false;
  function buildBar(onMenu) {
    testbar.hidden = false; testbar.className = barMin ? 'min' : '';
    testbar.innerHTML = '';
    var b = function (t, fn, id) { var e = h('button', { type: 'button', text: t, onclick: fn }); if (id) e.id = id; return e; };
    testbar.appendChild(h('span', { class: 'tb-label', text: 'TEST' }));
    if (!onMenu) {
      testbar.appendChild(b('◀ Préc.', function () { testStep(-1); }, 'tb-prev'));
      testbar.appendChild(b('Suiv. ▶', function () { testStep(+1); }, 'tb-next'));
      testbar.appendChild(b('Classement', function () { testRanking('peek'); }, 'tb-rank'));
      testbar.appendChild(b('Podium', testPodium, 'tb-podium'));
    }
    testbar.appendChild(b('Menu test', function () { clearTestOverlays(); go('testmenu'); }, 'tb-menu'));
    testbar.appendChild(b('Quitter le test', exitTest, 'tb-exit'));
    var t = b(barMin ? '＋' : '–', function () { barMin = !barMin; buildBar(onMenu); }); t.className = 'tb-toggle'; testbar.appendChild(t);
  }
  function clearTestOverlays() { stopConfetti(); }

  function testMenu() {
    var s = h('div', { class: 'screen testmenu' },
      h('h1', { class: 'title-serif', text: 'Mode test animateur' }),
      h('p', { class: 'note', text: 'Réservé à l’animateur · participants et scores d’essai · rien n’est enregistré · « Quitter le test » ramène à une partie vierge.' }));
    s.appendChild(h('h3', { text: 'Manches (écran d’introduction)' }));
    var chRow = h('div', { class: 'tmrow' });
    CH.forEach(function (c) { chRow.appendChild(h('button', { class: 'tmbtn', onclick: function () { toIntro(c.idx); }, style: 'flex:1;min-width:270px' }, 'M. ' + c.no + ' · ' + c.title, h('small', { text: c.count + ' épreuves' }))); });
    s.appendChild(chRow);
    s.appendChild(h('h3', { text: 'Épreuves (accès direct)' }));
    CH.forEach(function (c) {
      var row = h('div', { class: 'tmchap' }, h('div', { class: 'lab', text: c.no + '. ' + c.title }));
      Q.filter(function (q) { return q.ch === c.idx; }).forEach(function (q) {
        row.appendChild(h('button', { class: 'tmbtn tmq' + (q.points > 1 ? ' bonus' : '') + (q.placeholder ? ' ph' : ''), title: q.id + ' · ' + q.type, onclick: function () { toQuestion(q.n); } },
          (q.n + 1) + (q.points > 1 ? ' ★' : ''), h('small', { text: window.ExpressionsModel.TYPE_SHORT[q.type] })));
      });
      s.appendChild(row);
    });
    s.appendChild(h('h3', { text: 'Classements et podium' }));
    s.appendChild(h('div', { class: 'tmrow' },
      h('button', { class: 'btn small', onclick: function () { go('home'); } }, 'Accueil'),
      h('button', { class: 'btn small', onclick: function () { testRanking('between', 2); } }, 'Classement Q12'),
      h('button', { class: 'btn small', onclick: function () { testRanking('between', 4); } }, 'Classement Q24'),
      h('button', { class: 'btn small', onclick: function () { toIntro(CH.length - 1); } }, 'Finale'),
      h('button', { class: 'btn small', onclick: function () { testRanking('finale'); } }, 'Classement final animé'),
      h('button', { class: 'btn orange small', onclick: testPodium }, 'Podium (progressif)'),
      h('button', { class: 'btn outline small', onclick: function () { randomScores(); testMenu(); } }, 'Scores d’essai aléatoires'),
      h('button', { class: 'btn outline small', onclick: exitTest }, 'Quitter le test')));
    show(s);
  }

  /* ---------- clavier ---------- */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    var q = state.screen === 'question' ? Q[state.idx] : null;
    var twoChoose = q && q.kind === 'two' && state.phase === 'choose';
    if (k === 'f' && !twoChoose) { toggleFull(); return; } // (Vrai/Faux : F = FAUX → bouton ou F11 pour le plein écran)
    if (state.screen === 'home' && k === 't') { enterTest(); return; }
    if (state.screen === 'intro' && k === 'enter') { startChapter(); return; }
    if (state.screen === 'ranking' && k === 'enter' && state.rankMode !== 'peek') { if (state.rankMode === 'between') go('intro'); else startPodium(); return; }
    if (state.screen === 'final' && k === 'enter') { if (state.mode === 'individual' && (state.podiumStep || 0) < podiumTop().length) revealNextPodium(); return; }
    if (q) {
      if (state.phase === 'look') { if (k === 'enter') { state.phase = 'choose'; save(); question(); } }
      else if (state.phase === 'choose') {
        var map = q.kind === 'two' ? { v: 0, f: 1, '1': 0, '2': 1 } : { a: 0, b: 1, c: 2, '1': 0, '2': 1, '3': 2 };
        if (q.type === 'legend') map = { f: 0, l: 1, '1': 0, '2': 1 };
        var i = map[k];
        if (i != null) selectAnswer(i);
        else if (k === 'enter' && state.selected != null) reveal();
      } else if (k === 'enter' && state.phase === 'revealed' && document.activeElement && document.activeElement.tagName !== 'BUTTON') {
        if (indivMode()) { state.phase = 'award'; save(); question(); } else next();
      }
    }
  });
  document.addEventListener('fullscreenchange', fit);

  /* ---------- démarrage ---------- */
  fit();
  load();
  if (M.errors.length) showErrors(); else render();
  window.__quiz = {
    get state() { return state; }, model: M,
    jump: function (idx, phase) { toQuestion(idx, phase); }
  };
})();

</script>
