/* OBEO — Le Grand Pendu. Base graphique commune aux jeux OBEO (couleurs, boutons, animations) + écrans propres au pendu. Scène 1920×1080 mise à l'échelle. */
:root {
  --bg: #F5F1E9;
  --green: #247F78;
  --green-dark: #1B625C;
  --green-soft: #DCEFE8;
  --orange: #DA8548;
  --orange-dark: #B85A1B;
  --text: #292927;
  --muted: #5F5C56;
  --card: #FFFFFF;
  --red: #B23A30;
  --red-soft: #F7E1DE;
  --line: #E4DDCF;
  --shadow: 0 8px 30px rgba(41, 41, 39, .10);
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; }
#viewport { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* ---------- animations (250–500 ms, douces) ---------- */
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
@keyframes zoomIn { from { opacity: 0; transform: scale(.98) } to { opacity: 1; transform: none } }
.screen { position: absolute; inset: 0; animation: fadeIn .3s ease both; }
.a-up { animation: slideUp .45s ease both; }
.a-zoom { animation: zoomIn .4s ease both; }
.d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .01s !important; } }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 18px; border: 0; cursor: pointer; border-radius: 999px;
  font-weight: 700; letter-spacing: .02em; color: #fff; background: var(--green); padding: 0 56px; height: 96px; font-size: 38px;
  box-shadow: 0 8px 20px rgba(36, 127, 120, .28); transition: transform .25s ease, background .25s ease, box-shadow .25s ease; text-transform: uppercase; }
.btn:hover { background: var(--green-dark); transform: translateY(-2px); }
.btn:focus-visible, .chip-btn:focus-visible, .icon-btn:focus-visible, .answer:focus-visible, input:focus-visible { outline: 5px solid #1B3A38; outline-offset: 4px; }
.btn.orange { background: var(--orange-dark); box-shadow: 0 8px 20px rgba(184, 90, 27, .3); }
.btn.orange:hover { background: #9C4A12; }
.btn.outline { background: #fff; color: var(--orange-dark); border: 4px solid var(--orange-dark); box-shadow: none; }
.btn.outline:hover { background: #FFF4EA; }
.btn.small { height: 76px; font-size: 30px; padding: 0 40px; }
.btn[aria-disabled="true"] { background: #8C8982; box-shadow: none; cursor: not-allowed; transform: none; }
.btn svg { width: 40px; height: 40px; flex: none; }
.icon-btn { display: inline-flex; align-items: center; gap: 12px; height: 68px; padding: 0 28px; border-radius: 999px; border: 3px solid var(--line);
  background: #fff; color: var(--text); font-size: 26px; font-weight: 600; cursor: pointer; transition: background .25s, border-color .25s; }
.icon-btn:hover { background: #FBF8F2; border-color: var(--green); }
.icon-btn svg { width: 32px; height: 32px; }
.leaves { position: absolute; pointer-events: none; }
.logo { height: 92px; width: auto; display: block; }

/* ---------- en-tête ---------- */
.head { position: absolute; left: 60px; right: 60px; top: 24px; height: 96px; display: flex; align-items: center; gap: 22px; }
.head .logo { height: 76px; }
.head .where { font-size: 34px; font-weight: 800; color: var(--green-dark); letter-spacing: .03em; white-space: nowrap; }
.head .grow { flex: 1; }
.pill { background: var(--orange-dark); color: #fff; border-radius: 999px; padding: 12px 30px; font-size: 30px; font-weight: 700; white-space: nowrap; }
.pill.green { background: var(--green-dark); }
.pill.soft { background: var(--green-soft); color: var(--green-dark); }

/* ---------- accueil ---------- */
.home .col { position: absolute; left: 110px; top: 70px; width: 860px; }
.home .logo { height: 150px; }
.home h1 { font-size: 104px; line-height: 1.02; margin-top: 30px; font-family: var(--sans); font-weight: 800; letter-spacing: -.01em; }
.home .sub { font-size: 46px; font-weight: 700; color: var(--green); margin: 18px 0 0; }
.home .tag { font-size: 34px; color: var(--text); margin: 0; }
.home .place { font-size: 28px; font-weight: 600; color: var(--muted); margin-top: 14px; letter-spacing: .04em; }
.home .actions { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; margin-top: 40px; }
.home .resume { background: #fff; border-radius: 28px; box-shadow: var(--shadow); padding: 18px 28px; font-size: 28px; color: var(--muted); border-left: 10px solid var(--orange); max-width: 820px; }
.home .resume b { color: var(--text); }
.home .art { position: absolute; right: 0; top: 0; bottom: 0; width: 900px; border-radius: 540px 0 0 540px;
  background: linear-gradient(160deg, var(--green) 0%, #2E8C84 45%, #C9A27C 120%); box-shadow: var(--shadow); overflow: hidden; }
.home .art .board { position: absolute; left: 190px; top: 220px; display: grid; grid-template-columns: repeat(5, 110px); gap: 14px; }
.home .art .board span { height: 120px; border-radius: 22px; background: rgba(255,255,255,.95); display: grid; place-items: center; font-size: 70px; font-weight: 800; color: var(--green-dark); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.home .art .board span.h { background: rgba(255,255,255,.25); color: transparent; border-bottom: 8px solid #fff; }
.home .art .mini { position: absolute; left: 330px; top: 420px; width: 330px; height: 330px; }
.testlink { position: absolute; left: 18px; bottom: 16px; width: 54px; height: 54px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); opacity: .28; cursor: pointer; padding: 10px; }
.testlink:hover, .testlink:focus-visible { opacity: .8; }
.testlink svg { width: 100%; height: 100%; }

/* ---------- transitions entre manches ---------- */
.trans { background: linear-gradient(150deg, #FBF8F2 0%, var(--bg) 55%, #F3E3D2 100%); }
.trans .center { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
.trans .done { font-size: 38px; font-weight: 700; color: var(--muted); }
.trans .gscore { font-size: 64px; font-weight: 800; color: var(--orange-dark); }
.trans .gscore b { font-size: 110px; }
.trans .next { font-size: 40px; font-weight: 800; letter-spacing: .12em; color: #fff; background: var(--green-dark); border-radius: 999px; padding: 12px 40px; margin-top: 30px; }
.trans h1 { font-size: 92px; font-family: var(--sans); font-weight: 800; }
.trans .btn { margin-top: 30px; }
.trans.finale { background: radial-gradient(circle at 50% 40%, #2E8C84 0%, var(--green-dark) 55%, #123F3B 100%); }
.trans.finale h1, .trans.finale .done { color: #fff; }
.trans.finale .gscore { color: #F6C89A; }
.trans.finale .next { background: var(--orange-dark); }
.trans.finale .five { font-size: 46px; font-weight: 700; color: #DCEFE8; }
.trans .rays { position: absolute; left: 50%; top: 45%; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; pointer-events: none; opacity: .14;
  background: repeating-conic-gradient(#fff 0 6deg, transparent 6deg 18deg); animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.08); opacity: 1 } 100% { transform: none } }
.pop { animation: pop .6s cubic-bezier(.2,.8,.3,1.2) both; }

/* ---------- match ---------- */
.match .drawcard { position: absolute; left: 60px; top: 140px; width: 520px; height: 540px; background: #fff; border-radius: 36px; box-shadow: var(--shadow); padding: 18px; }
.match .drawcard svg { width: 100%; height: 440px; display: block; }
.match .errs { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 36px; font-weight: 800; color: var(--text); margin-top: 6px; }
.match .errs .dots { display: flex; gap: 8px; }
.match .errs .dots i { width: 22px; height: 22px; border-radius: 50%; background: var(--line); }
.match .errs .dots i.on { background: var(--orange-dark); }
.match .right { position: absolute; left: 630px; right: 60px; top: 140px; height: 540px; display: flex; flex-direction: column; gap: 22px; }
.match .cat { align-self: flex-start; background: var(--green-soft); color: var(--green-dark); border-radius: 999px; padding: 10px 30px; font-size: 32px; font-weight: 800; }
.match .cat small { font-weight: 600; color: var(--muted); margin-right: 10px; }
.word { display: flex; gap: 14px; flex-wrap: nowrap; justify-content: center; }
.word span { width: 100px; height: 124px; border-radius: 20px; background: #fff; box-shadow: var(--shadow); border-bottom: 8px solid var(--green); display: grid; place-items: center;
  font-size: 84px; font-weight: 800; color: var(--green-dark); }
.word span.hide { color: transparent; background: #FBF8F2; border-bottom-color: var(--line); }
.word span.new { animation: pop .55s cubic-bezier(.2,.8,.3,1.2) both; background: var(--green-soft); }
.word span.miss { color: var(--red); border-bottom-color: var(--red); background: var(--red-soft); }
.word.long span { width: 92px; font-size: 76px; }
.hintrow { display: flex; align-items: center; gap: 20px; }
.hintbtn { height: 80px; padding: 0 36px; border-radius: 999px; border: 4px solid var(--orange-dark); background: #fff; color: var(--orange-dark); font-size: 30px; font-weight: 800; letter-spacing: .04em; cursor: pointer; }
.hintbtn:hover { background: #FFF4EA; }
.hintbtn[disabled] { border-color: var(--line); color: #A8A39A; background: #F3EFE7; cursor: not-allowed; }
.hintbtn.used { border-color: var(--orange-dark); background: var(--orange-dark); color: #fff; }
.potential { margin-left: auto; font-size: 34px; font-weight: 800; color: var(--green-dark); background: #fff; border-radius: 999px; padding: 12px 32px; box-shadow: var(--shadow); white-space: nowrap; }
.potential b { color: var(--orange-dark); font-size: 44px; }
.potential.flash { animation: pop .6s ease both; }
.hints { display: flex; flex-direction: column; gap: 14px; }
.hint { background: #FFF8F0; border-left: 10px solid var(--orange); border-radius: 22px; padding: 14px 26px; font-size: 32px; line-height: 1.3; animation: slideUp .4s ease both; }
.hint b { color: var(--orange-dark); margin-right: 10px; }
.hint.empty { background: transparent; border-left-color: transparent; color: var(--muted); font-style: italic; font-size: 28px; padding-left: 0; }

/* clavier */
.keyboard { position: absolute; left: 60px; right: 60px; top: 712px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.keyboard .row { display: flex; gap: 14px; }
.key { width: 122px; height: 104px; border-radius: 22px; border: 0; background: #fff; box-shadow: 0 6px 16px rgba(41,41,39,.12); font-size: 56px; font-weight: 800; color: var(--text); cursor: pointer;
  transition: transform .15s ease, background .2s ease; }
.key:hover { transform: translateY(-3px); background: #FBF8F2; }
.key:focus-visible { outline: 5px solid #1B3A38; outline-offset: 3px; }
.key.hit { background: var(--green); color: #fff; box-shadow: none; cursor: default; transform: none; }
.key.miss { background: #E9E4DA; color: #B1AA9E; box-shadow: none; cursor: default; transform: none; text-decoration: line-through; text-decoration-thickness: 5px; }
.key[disabled] { cursor: default; }
.keyboard .help { font-size: 26px; color: var(--muted); margin-top: 2px; }

/* fin de match */
.veil { position: absolute; inset: 0; background: rgba(245,241,233,.82); backdrop-filter: blur(3px); animation: fadeIn .35s ease both; }
.result { position: absolute; left: 260px; right: 260px; top: 150px; background: #fff; border-radius: 44px; box-shadow: 0 20px 60px rgba(41,41,39,.18); padding: 40px 60px 44px; text-align: center; animation: zoomIn .45s ease both; }
.result h2 { margin: 0; font-size: 96px; font-weight: 800; letter-spacing: .02em; color: var(--green-dark); }
.result.lost h2 { color: var(--orange-dark); }
.result .full { margin: 14px auto 6px; font-size: 92px; font-weight: 800; letter-spacing: .14em; color: var(--text); }
.result .scores { display: flex; justify-content: center; gap: 30px; margin-top: 14px; }
.result .scores div { border-radius: 26px; padding: 14px 34px; font-size: 38px; font-weight: 800; background: var(--green-soft); color: var(--green-dark); }
.result .scores div.g { background: #FBEBDD; color: var(--orange-dark); }
.result .savez { margin: 30px auto 0; max-width: 1180px; text-align: left; background: #FBFAF6; border-radius: 26px; border-left: 12px solid var(--green); padding: 20px 30px; opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
.result .savez.show { opacity: 1; transform: none; }
.result .savez h3 { margin: 0 0 6px; font-size: 34px; color: var(--orange-dark); }
.result .savez p { margin: 0; font-size: 34px; line-height: 1.34; }
.result .btn { margin-top: 30px; }

/* ---------- écran final ---------- */
.final { background: linear-gradient(160deg, #DCEFE8, #F5F1E9 55%, #F6DEC4); }
.final .head { justify-content: center; }
.final .center { position: absolute; left: 0; right: 0; top: 130px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.final .lab { font-size: 54px; font-weight: 800; letter-spacing: .16em; color: var(--green-dark); }
.final .big { font-size: 230px; line-height: 1; font-weight: 800; color: var(--orange-dark); margin: 6px 0 0; }
.final .big small { font-size: 110px; color: var(--muted); }
.final .appr { margin-top: 18px; font-size: 76px; font-weight: 800; color: var(--green-dark); }
.final .recap { display: grid; grid-template-columns: repeat(10, 160px); gap: 12px; margin-top: 40px; }
.final .recap div { background: #fff; border-radius: 18px; padding: 10px 6px; box-shadow: var(--shadow); font-size: 20px; font-weight: 700; color: var(--muted); }
.final .recap div b { display: block; font-size: 32px; color: var(--green-dark); }
.final .recap div.z b { color: #B1AA9E; }
.final .thanks { margin-top: 30px; font-size: 40px; font-weight: 700; color: var(--orange-dark); }
.final .btn { margin-top: 24px; }

/* ---------- confirmation ---------- */
.confirm { position: absolute; inset: 0; background: rgba(41,41,39,.45); display: grid; place-items: center; z-index: 20; animation: fadeIn .25s ease both; }
.confirm .box { background: #fff; border-radius: 40px; padding: 50px 60px; width: 1000px; text-align: center; box-shadow: var(--shadow); }
.confirm h2 { margin: 0 0 14px; font-size: 54px; color: var(--green-dark); }
.confirm p { font-size: 32px; color: var(--muted); margin: 0 0 30px; }
.confirm .row { display: flex; gap: 24px; justify-content: center; }

/* ---------- mode test ---------- */
#testbar { position: fixed; left: 50%; top: 0; transform: translateX(-50%); z-index: 40; display: flex; gap: 4px; align-items: center; background: rgba(27,58,56,.92); border-radius: 0 0 14px 14px; padding: 4px 10px; font: 600 13px/1.2 var(--sans); flex-wrap: wrap; max-width: 98vw; justify-content: center; }
#testbar[hidden] { display: none; }
#testbar button { background: transparent; color: #fff; border: 0; padding: 6px 8px; font: inherit; cursor: pointer; border-radius: 6px; }
#testbar button:hover { background: rgba(255,255,255,.15); }
#testbar .tb-label { color: #F6C89A; padding: 0 6px; font-weight: 800; }
#testbar .peek { color: #F6C89A; padding: 0 6px; letter-spacing: .1em; }
.testmenu { padding: 50px 70px; overflow: auto; background: #FBF8F2; }
.testmenu h1 { font-size: 54px; margin: 0 0 6px; }
.testmenu .note { font-size: 22px; color: var(--muted); margin: 0 0 18px; }
.testmenu h3 { font-size: 26px; margin: 22px 0 10px; color: var(--green-dark); }
.tmrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.tmbtn { border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 10px 16px; font-size: 22px; font-weight: 700; cursor: pointer; min-width: 160px; text-align: left; }
.tmbtn small { display: block; font-weight: 500; color: var(--muted); font-size: 17px; }
.tmbtn:hover { border-color: var(--green); }
.tmrow input { font-size: 26px; width: 140px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); }

</style>
</head>

    stage.appendChild(box);
  }

  /* ---------- transitions entre manches ---------- */
  function trans() {
    var no = state.trans, M = MANCHES[no - 1], prev = no - 1;
    var s = h('div', { class: 'screen trans' + (M.finale ? ' finale' : '') }, M.finale ? h('div', { class: 'rays' }) : leaves('right:-20px;bottom:-20px;width:300px;height:270px;opacity:.9'));
    var c = h('div', { class: 'center' });
    if (prev) {
      c.appendChild(h('div', { class: 'done a-up', text: 'Fin de la manche ' + prev }));
      c.appendChild(h('div', { class: 'gscore pop', html: (M.finale ? 'Score actuel : ' : 'Score général : ') + '<b>' + general(lastOf(prev)) + '</b> / ' + prev * 5 * E.MATCH_MAX }));
    }
    c.appendChild(h('div', { class: 'next a-up d2', text: M.finale ? 'GRANDE FINALE' : 'MANCHE ' + no }));
    c.appendChild(h('h1', { class: 'title-serif a-up d2', text: M.finale ? '5 derniers mots' : M.title }));
    if (!prev) c.appendChild(h('div', { class: 'done a-up d3', text: '5 mots à retrouver · 5 points par mot' }));
    c.appendChild(h('div', { class: 'a-up d3' }, h('button', { class: 'btn' + (M.finale ? ' orange' : ''), onclick: function () { state.idx = firstOf(no); go('match'); } },
      M.finale ? 'Lancer la grande finale' : 'Commencer la manche ' + no, icon('arrow'))));
    s.appendChild(c);
    show(s);
    if (prev) startConfetti(M.finale ? 90 : 40);
  }

  /* ---------- match ---------- */
  var lastHit = null, lastErrors = -1, flashPot = false;
  function match() {
    var i = state.idx, w = MATCHS[i], m = state.matches[i];
    var over = m.status !== 'playing';
    var s = h('div', { class: 'screen match' });
    s.appendChild(header());
    // dessin + erreurs
    var dots = h('div', { class: 'dots' });
    for (var k = 0; k < E.MAX_ERRORS; k++) dots.appendChild(h('i', { class: k < m.errors ? 'on' : '' }));
    s.appendChild(h('div', { class: 'drawcard' }, h('div', { html: drawing(m.errors, lastErrors >= 0 && m.errors > lastErrors) }),
      h('div', { class: 'errs' }, h('span', { class: 'errtxt', text: 'Erreurs : ' + m.errors + ' / ' + E.MAX_ERRORS }), dots)));
    lastErrors = m.errors;
    // mot, indices, points possibles
    var chars = Array.from(w.word);
    var word = h('div', { class: 'word' + (chars.length > 10 ? ' long' : ''), 'aria-label': 'Mot à trouver' });
    chars.forEach(function (c) {
      var shown = E.revealed(w.word, m, c);
      var cl = shown ? (lastHit && E.norm(c) === lastHit ? 'new' : '') : (over ? 'miss' : 'hide');
      word.appendChild(h('span', { class: cl, text: shown || over ? c : '' }));
    });
    lastHit = null;
    var pot = h('div', { class: 'potential' + (flashPot ? ' flash' : ''), html: 'Points possibles : <b>' + E.potential(m) + '</b>' });
    flashPot = false;
    var h1 = h('button', { class: 'hintbtn' + (m.hints >= 1 ? ' used' : ''), disabled: m.hints >= 1 || over ? 'disabled' : null, onclick: function () { hint(); } }, 'INDICE 1');
    var h2 = h('button', { class: 'hintbtn' + (m.hints >= 2 ? ' used' : ''), disabled: m.hints !== 1 || over ? 'disabled' : null, onclick: function () { hint(); } }, 'INDICE 2');
    var hints = h('div', { class: 'hints' });
    if (m.hints >= 1) hints.appendChild(h('div', { class: 'hint h1' }, h('b', { text: 'Indice 1 :' }), w.hint1));
    if (m.hints >= 2) hints.appendChild(h('div', { class: 'hint h2' }, h('b', { text: 'Indice 2 :' }), w.hint2));
    if (!m.hints) hints.appendChild(h('div', { class: 'hint empty', text: 'Indice 1 : le mot vaut alors 3 points · Indice 2 : 1 point.' }));
    s.appendChild(h('div', { class: 'right' },
      h('div', { class: 'cat' }, h('small', { text: 'Catégorie :' }), w.category),
      word, h('div', { class: 'hintrow' }, h1, h2, pot), hints));
    // clavier A–Z (une lettre jouée devient indisponible)
    var kb = h('div', { class: 'keyboard' });
    ROWS.forEach(function (r) {
      var row = h('div', { class: 'row' });
      r.split('').forEach(function (L) {
        var played = m.played.indexOf(L) >= 0, inWord = E.needed(w.word).indexOf(L) >= 0;
        row.appendChild(h('button', { class: 'key' + (played ? (inWord ? ' hit' : ' miss') : ''), 'data-l': L, disabled: played || over ? 'disabled' : null,
          'aria-label': 'Lettre ' + L + (played ? ' (déjà jouée)' : ''), onclick: function () { letter(L); } }, L));
      });
      kb.appendChild(row);
    });
    kb.appendChild(h('div', { class: 'help', text: 'Les accents sont trouvés automatiquement : E révèle aussi É, È, Ê…' }));
    s.appendChild(kb);
    if (over) s.appendChild(resultPanel(i, w, m));
    show(s);
    addTestTag(s, i);
  }
  function letter(L) {
    var w = MATCHS[state.idx], m = state.matches[state.idx];
    var r = E.play(w.word, m, L);
    if (r.result === 'already' || r.result === 'over') return;
    if (r.result === 'hit') { lastHit = E.norm(L); tone([660, 880], 0.12); } else tone([240], 0.22);
    if (m.status === 'won') { tone([523, 659, 784, 1046], 0.16); }
    animate = false; match();
    if (m.status === 'won') startConfetti(60);
  }
  function hint() {
    var m = state.matches[state.idx];
    if (!E.useHint(m)) return;
    flashPot = true; tone([520], 0.12);
    animate = false; match();
  }
  function resultPanel(i, w, m) {
    var won = m.status === 'won', lastInManche = i === lastOf(w.manche), last = i === N - 1;
    var label = last ? 'Voir le score final' : lastInManche ? 'Fin de la manche ' + w.manche : 'Match suivant';
    var savez = h('div', { class: 'savez' }, h('h3', { text: '✨ Le saviez-vous ?' }), h('p', { text: w.anecdote }));
    var box = h('div', { class: 'result ' + (won ? 'won' : 'lost'), role: 'dialog', 'aria-label': won ? 'Mot trouvé' : 'Mot non trouvé' },
      h('h2', { class: 'pop', text: won ? 'BRAVO !' : 'Dommage !' }),
      h('div', { class: 'full', text: w.word }),
      h('div', { class: 'scores' },
        h('div', { class: 'ms', text: 'Score du match : ' + m.score + ' / ' + E.MATCH_MAX }),
        h('div', { class: 'g', text: 'Score général : ' + generalText() })),
      savez,
      h('button', { class: 'btn orange nextbtn', onclick: next }, label, icon('arrow')));
    setTimeout(function () { savez.classList.add('show'); }, 1200);
    return h('div', null, h('div', { class: 'veil' }), box);
  }
  function next() {
    var i = state.idx, w = MATCHS[i];
    if (i >= N - 1) { go('final'); return; }
    if (i === lastOf(w.manche)) { state.trans = w.manche + 1; state.idx = i + 1; go('trans'); return; }
    state.idx = i + 1; go('match');
  }
  function addTestTag(s, i) {
    if (state.test) s.appendChild(h('div', { class: 'testtag', style: 'position:absolute;left:24px;bottom:6px;font-size:16px;color:#8C8982', text: 'TEST · match ' + (i + 1) + ' · ' + MATCHS[i].word }));
  }

  /* ---------- écran final ---------- */
  function finalScreen() {
    var score = general();
    var recap = h('div', { class: 'recap a-up d3' });
    MATCHS.forEach(function (w, i) {
      var m = state.matches[i];
      recap.appendChild(h('div', { class: m.score ? '' : 'z', title: w.word }, h('b', { text: (m.status === 'playing' ? '–' : m.score) + ' / 5' }), w.word));
    });
    var s = h('div', { class: 'screen final' },
      h('div', { class: 'head' }, logo()),
      h('div', { class: 'center' },
        h('div', { class: 'lab a-up', text: 'SCORE FINAL' }),
        h('div', { class: 'big pop', html: score + '<small> / ' + N * E.MATCH_MAX + '</small>' }),
        h('div', { class: 'appr a-up d2', text: E.appreciation(score) }),
        recap,
        h('div', { class: 'thanks a-up d3', text: 'Merci à toute l’équipe pour cette belle partie !' }),
        h('div', { class: 'a-up d4' }, h('button', { class: 'btn', onclick: function () { if (state.test) { go('testmenu'); return; } newGame(); } }, 'Nouvelle partie', icon('arrow')))),
      leaves('left:-30px;bottom:-20px;width:300px;height:270px;opacity:.9'), leaves('right:-30px;bottom:-20px;width:300px;height:270px;opacity:.9;transform:scaleX(-1)'));
    show(s);
    tone([523, 659, 784, 1046, 1318], 0.18);
    startConfetti(120);
  }

  /* ---------- confettis légers ---------- */
  var cv = document.getElementById('confetti'), raf = null;
  function startConfetti(count) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    stopConfetti();
    var dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    var cols = ['#247F78', '#DA8548', '#E9DCC3', '#7FB8B1', '#F0C79E'], parts = [];
    for (var i = 0; i < count; i++) parts.push({ x: Math.random() * innerWidth, y: -Math.random() * innerHeight * 0.6, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6,
      c: cols[i % cols.length], vy: 60 + Math.random() * 60, vx: -14 + Math.random() * 28, ph: Math.random() * 6 });
    var t0 = performance.now(), last = t0;
    (function tick(now) {
      var dt = Math.min((now - last) / 1000, .05), el = (now - t0) / 1000; last = now;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(function (p) {
        p.y += p.vy * dt; p.x += (p.vx + Math.sin(el * 2 + p.ph) * 16) * dt;
        ctx.globalAlpha = .8 * (el > 5 ? Math.max(0, 1 - (el - 5)) : 1); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.w, p.h);
      });
      if (el < 6) raf = requestAnimationFrame(tick); else stopConfetti();
    })(t0);
  }
  function stopConfetti() {
    if (raf) cancelAnimationFrame(raf); raf = null;
    var c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
  }

  /* =====================================================================
     MODE TEST ANIMATEUR (roue crantée discrète en bas à gauche de l'accueil, ou touche T sur l'accueil)
     Partie d'essai séparée : la partie réelle sauvegardée n'est jamais modifiée.
     ===================================================================== */
  var peek = false;
  function enterTest() { var snd = state.sound; state = fresh(); state.sound = snd; state.test = true; go('testmenu'); }
  function exitTest() { peek = false; testbar.hidden = true; var s = readSave(); state = s || fresh(); if (state.screen !== 'home') state.screen = 'home'; go('home'); }
  function toMatch(i) { i = Math.max(0, Math.min(N - 1, i)); state.idx = i; state.matches[i] = E.fresh(); lastErrors = -1; go('match'); }
  function toTrans(no) { state.trans = no; state.idx = firstOf(no); go('trans'); }
  function simWin() { var w = MATCHS[state.idx], m = state.matches[state.idx]; if (m.status !== 'playing') return; E.needed(w.word).forEach(function (L) { E.play(w.word, m, L); }); animate = false; match(); }
  function simLose() { var m = state.matches[state.idx]; if (m.status !== 'playing') return; m.errors = E.MAX_ERRORS; E.finish(m, false); animate = false; match(); }
  function simHint(n) { var m = state.matches[state.idx]; while (m.hints < n && E.useHint(m)) flashPot = true; animate = false; match(); }
  function randomScores(upto) {
    for (var i = 0; i < upto; i++) { var m = E.fresh(); m.status = Math.random() < .8 ? 'won' : 'lost'; m.hints = Math.floor(Math.random() * 3); m.score = m.status === 'won' ? E.potential(m) : 0; state.matches[i] = m; }
  }
  function drawTestbar() {
    if (!state.test) { testbar.hidden = true; return; }
    testbar.hidden = false; testbar.innerHTML = '';
    var b = function (t, fn, id) { var e = h('button', { type: 'button', text: t, onclick: fn }); if (id) e.id = id; return e; };
    testbar.appendChild(h('span', { class: 'tb-label', text: 'TEST' }));
    if (state.screen === 'match') {
      testbar.appendChild(b('◀ Préc.', function () { toMatch(state.idx - 1); }, 'tb-prev'));
      testbar.appendChild(b('Suiv. ▶', function () { toMatch(state.idx + 1); }, 'tb-next'));
      testbar.appendChild(b('Indice 1', function () { simHint(1); }, 'tb-h1'));
      testbar.appendChild(b('Indice 2', function () { simHint(2); }, 'tb-h2'));
      testbar.appendChild(b('Victoire', simWin, 'tb-win'));
      testbar.appendChild(b('Échec', simLose, 'tb-lose'));
      testbar.appendChild(b(peek ? 'Masquer le mot' : 'Révéler le mot', function () { peek = !peek; drawTestbar(); }, 'tb-peek'));
      if (peek) testbar.appendChild(h('span', { class: 'peek', id: 'tb-word', text: MATCHS[state.idx].word }));
    }
    testbar.appendChild(b('Menu test', function () { go('testmenu'); }, 'tb-menu'));
    testbar.appendChild(b('Quitter le test', exitTest, 'tb-exit'));
  }
  function testMenu() {
    var s = h('div', { class: 'screen testmenu' },
      h('h1', { class: 'title-serif', text: 'Mode test animateur' }),
      h('p', { class: 'note', text: 'Partie d’essai séparée · rien n’est enregistré · la partie réelle en cours reste intacte · « Quitter le test » ramène à l’accueil.' }));
    MANCHES.forEach(function (M) {
      s.appendChild(h('h3', { text: 'Manche ' + M.no + ' — ' + M.title }));
      var row = h('div', { class: 'tmrow' });
      MATCHS.forEach(function (w, i) { if (w.manche === M.no) row.appendChild(h('button', { class: 'tmbtn tmm', onclick: function () { toMatch(i); } }, 'Match ' + (i + 1), h('small', { text: w.word }))); });
      s.appendChild(row);
    });
    s.appendChild(h('h3', { text: 'Transitions et fin de partie' }));
    s.appendChild(h('div', { class: 'tmrow' },
      h('button', { class: 'btn small', onclick: function () { toTrans(1); } }, 'Début manche 1'),
      h('button', { class: 'btn small', onclick: function () { toTrans(2); } }, 'Après manche 1'),
      h('button', { class: 'btn small', onclick: function () { toTrans(3); } }, 'Après manche 2'),
      h('button', { class: 'btn small orange', onclick: function () { toTrans(4); } }, 'Grande finale'),
      h('button', { class: 'btn small orange', onclick: function () { go('final'); } }, 'Écran final')));
    var inp = h('input', { type: 'number', min: '0', max: '100', value: String(general()), 'aria-label': 'Score général' });
    s.appendChild(h('h3', { text: 'Score général (correction manuelle)' }));
    s.appendChild(h('div', { class: 'tmrow' }, inp,
      h('button', { class: 'btn small outline', id: 'tm-setscore', onclick: function () {
        var v = Math.max(0, Math.min(100, parseInt(inp.value, 10) || 0)); state.adjust = 0; state.adjust = v - general(); testMenu();
      } }, 'Fixer le score'),
      h('button', { class: 'btn small outline', onclick: function () { randomScores(N); state.adjust = 0; testMenu(); } }, 'Scores d’essai aléatoires'),
      h('button', { class: 'btn small outline', onclick: function () { state.matches = fresh().matches; state.adjust = 0; testMenu(); } }, 'Remettre à zéro'),
      h('button', { class: 'btn small outline', onclick: exitTest }, 'Quitter le test')));
    show(s);
  }

  /* ---------- clavier physique ---------- */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (state.screen === 'home' && e.key.toLowerCase() === 't' && !inProgress(readSave())) { enterTest(); return; }
    if (state.screen === 'match') {
      var m = state.matches[state.idx];
      if (m.status === 'playing' && /^[a-zA-Z]$/.test(e.key)) { letter(e.key.toUpperCase()); return; }
      if (m.status !== 'playing' && e.key === 'Enter' && (!document.activeElement || document.activeElement.tagName !== 'BUTTON')) next();
    }
  });

  /* ---------- démarrage : toujours l'accueil, avec reprise proposée si une partie est en cours ---------- */
  fit();
  var s0 = readSave();
  if (s0) { state.sound = s0.sound !== false; }
  render();
  window.__pendu = { get state() { return state; }, engine: E, data: D, general: general };
})();

</script>
</body>
